services:
  fastapi:
    build: .
    image: dustlab-fastapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - /etc/dustlab-mqtt/certs:/mosquitto/certs:ro

  mqtt_subscriber:
    build: .
    image: dustlab-fastapi
    command: ["python", "-m", "app.mqtt_subscriber"]
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file:
      - /home/ubuntu/dustlab-mqtt.env
    volumes:
      - ./data:/app/data
